---
<!DOCTYPE html>
<html lang="zh-CN" data-section="essays" data-intensity="medium">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Essays | MiracleFarms</title>
<meta name="description" content="MiracleFarms Essays — AI Infrastructure 的长文与系统性文章。" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/notion.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel" src="../assets/shared.jsx"></script>
<script type="text/babel">
/* global React, ReactDOM, TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle,
          Icon, MFMark, HandleDots, Topbar, PageHead, PageFooter, ALL_ESSAYS, useApplyTweaks, useSection */

/* ── Jekyll live data (overrides shared.jsx defaults) ── */
{% assign _posts = site.posts | where: 'kind', 'essay' %}
{% assign en_paths = '' %}{% for p in site.posts %}{% if p.path contains '.en.md' %}{% assign en_paths = en_paths | append: '||' | append: p.path %}{% endif %}{% endfor %}
window.ALL_ESSAYS = [
{% for post in _posts %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
{% raw %}

const { useState, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontStyle": "serif",
  "smallText": false,
  "fullWidth": false,
  "intensity": "medium"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  useSection("essays");
  useApplyTweaks(t);

  const [activeTag, setActiveTag] = useState(null);

  const tagCounts = useMemo(() => {
    const m = new Map();
    for (const e of ALL_ESSAYS) for (const tag of e.tags) m.set(tag, (m.get(tag) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }, []);

  const filtered = useMemo(
    () => activeTag ? ALL_ESSAYS.filter(e => e.tags.includes(activeTag)) : ALL_ESSAYS,
    [activeTag]
  );

  // Group by year
  const byYear = useMemo(() => {
    const groups = {};
    for (const e of filtered) {
      const y = e.date.slice(0, 4);
      (groups[y] = groups[y] || []).push(e);
    }
    return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
  }, [filtered]);

  return (
    <>
      <Topbar active="essays" />
      <main className="page">
        <div className="pg-meta">
          <a href="/">MiracleFarms</a>
          <span className="dot">›</span>
          <span>Essays</span>
        </div>

        <PageHead section="essays" />

        <aside className="callout">
          <span className="ico" aria-hidden="true">📚</span>
          <div>
            <p>
              共 <strong>{ALL_ESSAYS.length}</strong> 篇 · 主题覆盖 <strong>Inference / Agents / Memory / Evaluation / Reliability</strong>。每一篇都尝试在一个具体边界上给出可复盘的判断，而不是综述。
            </p>
          </div>
        </aside>

        {/* Filter bar (no view switcher — essays are read in order) */}
        <div className="filterbar" role="toolbar" aria-label="筛选">
          <span className="lbl">Filter:</span>
          <button
            className={"fchip" + (activeTag === null ? " on" : "")}
            onClick={() => setActiveTag(null)}
            type="button"
          >全部 <span className="count">{ALL_ESSAYS.length}</span></button>
          {tagCounts.map(([tag, n]) => (
            <button
              key={tag}
              className={"fchip" + (activeTag === tag ? " on" : "")}
              onClick={() => setActiveTag(activeTag === tag ? null : tag)}
              type="button"
            >{tag} <span className="count">{n}</span></button>
          ))}
        </div>

        {filtered.length === 0 ? (
          <div className="empty">没有匹配的 essay。</div>
        ) : (
          byYear.map(([yr, items]) => (
            <section key={yr}>
              <div className="year-row">
                <span className="yr">{yr}</span>
                <span className="ln" />
                <span>{items.length} 篇</span>
              </div>
              <div className="pagelist" role="list">
                {items.map((e, i) => (
                  <a key={i} className="pagelink" href={e.href} role="listitem">
                    <HandleDots />
                    <span className="pl-ico" aria-hidden="true"><Icon name="pen" size={16} /></span>
                    <div className="pl-body">
                      <div className="pl-title">{e.title}{e.locked && <span className="pl-lock" aria-label="需要密码">🔒</span>}{e.hasEn && <span className="pl-lang" title="中英双语" aria-label="提供中英双语版本"><i>中</i><i>EN</i></span>}</div>
                      <div className="pl-excerpt">{e.excerpt}</div>
                      <div className="pl-meta">
                        {e.tags.map(tag => <span key={tag} className="tag">{tag}</span>)}
                      </div>
                    </div>
                    <div className="pl-date">{e.date}</div>
                  </a>
                ))}
              </div>
            </section>
          ))
        )}

        <hr className="divider" />

        <h6 className="h2-sub">Reading note</h6>
        <h2 className="h2">关于 Essays 的写作</h2>
        <p className="muted">
          Essays 的更新频率明显低于 Briefs——它们通常需要数周到数月的观察沉淀，并经过一次以上的重写。我们倾向于把已经被多个 brief 反复触及的主题，整理成一篇可以长期被引用的 essay。
        </p>

      </main>
      <PageFooter />

      <TweaksPanel title="Tweaks">
        <TweakSection label="板块色强度 Section colour">
          <TweakRadio
            value={t.intensity}
            onChange={(v) => setTweak("intensity", v)}
            options={[
              { value: "clean",      label: "克制" },
              { value: "medium",     label: "中度" },
              { value: "expressive", label: "明显" },
            ]}
          />
        </TweakSection>
        <TweakSection label="字体 Font style">
          <TweakRadio
            value={t.fontStyle}
            onChange={(v) => setTweak("fontStyle", v)}
            options={[
              { value: "default", label: "Default" },
              { value: "serif",   label: "Serif" },
              { value: "mono",    label: "Mono" },
            ]}
          />
        </TweakSection>
        <TweakSection label="排版 Layout">
          <TweakToggle label="Small text 小字号" value={t.smallText} onChange={(v) => setTweak("smallText", v)} />
          <TweakToggle label="Full width 全宽页面" value={t.fullWidth} onChange={(v) => setTweak("fullWidth", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>

<style id="__om-edit-overrides"></style>
</body>
</html>
