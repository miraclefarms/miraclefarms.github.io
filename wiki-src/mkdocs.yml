site_name: Miracle Farms Wiki
site_url: https://miraclefarms.github.io/wiki/
site_description: AI Infra 和 LLM Systems 技术知识库

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - KVCache:
      - 综述首页: kvcache/index.md
      - 第一性原理: kvcache/first-principles.md
      - 基础概念: kvcache/basics.md
      - 算法维度（横向）:
          - Attention 变体: kvcache/attention-variants.md
          - 稀疏化: kvcache/sparsity.md
          - 压缩与量化: kvcache/compression-quantization.md
      - 系统维度（纵向）:
          - 运行时架构: kvcache/runtime-architecture.md
          - 存储层级: kvcache/storage-hierarchy.md
          - Paged KV: kvcache/paged-kv.md
          - Prefix Cache: kvcache/prefix-cache.md
          - KV Offload: kvcache/offload.md
          - 生命周期与淘汰: kvcache/lifecycle.md
      - 部署维度:
          - PD 分离: kvcache/pd-disaggregation.md
          - 并行切分: kvcache/parallelism.md
          - 路由与亲和性: kvcache/routing.md
          - 弹性与故障: kvcache/elasticity.md
      - 工作负载维度:
          - 总览: kvcache/workloads.md
          - 多轮对话: kvcache/workload-multiturn.md
          - Agent 协作: kvcache/workload-agent.md
          - Coding / 长上下文: kvcache/workload-coding.md
          - RAG / 检索增强: kvcache/workload-rag.md
          - Reasoning / Long CoT: kvcache/workload-reasoning.md
      - 维度交叉:
          - 总览: kvcache/crossings.md
          - 算法 × 系统: kvcache/crossing-algo-system.md
          - 系统 × 部署: kvcache/crossing-system-deployment.md
          - 部署 × 工作负载: kvcache/crossing-deployment-workload.md
          - 算法 × 工作负载: kvcache/crossing-algo-workload.md
          - 四维联动范式: kvcache/crossing-paradigms.md
      - 评估方法:
          - 总览: kvcache/evaluation.md
          - 指标体系: kvcache/evaluation-metrics.md
          - Benchmark 与工具: kvcache/evaluation-benchmarks.md
          - 场景评估矩阵: kvcache/evaluation-scenarios.md
      - 未来方向:
          - 总览: kvcache/future.md
          - 算法侧: kvcache/future-algorithm.md
          - 系统侧: kvcache/future-system.md
          - 部署侧: kvcache/future-deployment.md
          - 工作负载演进: kvcache/future-workloads.md
      - 框架对比:
          - 总览与对比表: kvcache/frameworks.md
          - vLLM: kvcache/framework-vllm.md
          - SGLang: kvcache/framework-sglang.md
          - TensorRT-LLM: kvcache/framework-trtllm.md
          - LMCache: kvcache/framework-lmcache.md
          - Mooncake: kvcache/framework-mooncake.md
      - 附录:
          - 术语表: kvcache/glossary.md
          - 参考资料: kvcache/references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
