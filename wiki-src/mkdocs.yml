site_name: Miracle Farms Wiki
site_url: https://miraclefarms.github.io/wiki/
site_description: AI Infra 和 LLM Systems 技术知识库

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - KVCache:
      - 综述首页: kvcache/index.md
      - 第一性原理: kvcache/first-principles.md
      - 基础概念: kvcache/basics.md
      - 算法维度（横向）:
          - Attention 变体: kvcache/attention-variants.md
          - 稀疏化: kvcache/sparsity.md
          - 压缩与量化: kvcache/compression-quantization.md
      - 系统维度（纵向）:
          - 运行时架构: kvcache/runtime-architecture.md
          - 存储层级: kvcache/storage-hierarchy.md
          - Paged KV: kvcache/paged-kv.md
          - Prefix Cache: kvcache/prefix-cache.md
          - KV Offload: kvcache/offload.md
          - 生命周期与淘汰: kvcache/lifecycle.md
      - 部署维度:
          - PD 分离: kvcache/pd-disaggregation.md
          - 并行切分: kvcache/parallelism.md
          - 路由与亲和性: kvcache/routing.md
          - 弹性与故障: kvcache/elasticity.md
      - 工作负载维度: kvcache/workloads.md
      - 维度交叉: kvcache/crossings.md
      - 评估方法: kvcache/evaluation.md
      - 未来方向: kvcache/future.md
      - 框架对比: kvcache/frameworks.md
      - 术语表: kvcache/glossary.md
      - 参考资料: kvcache/references.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
