<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 会话中的成本差距</title>
  <desc id="desc">用条形图对比无缓存和高命中缓存下的会话成本，并说明前缀固定带来的缓存读取占比上升。</desc>
  <defs>
    <style>
      .bg { fill: #fcfaf6; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .value { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text x="80" y="82" class="title">会话越长，前缀稳定带来的成本差距越明显</text>
  <text x="80" y="116" class="subtitle">原创示意图：按照文中示例重绘“无缓存”与“92% 缓存效率”下的账单差异</text>

  <line x1="120" y1="580" x2="1080" y2="580" stroke="#0f172a" stroke-width="3"/>
  <line x1="120" y1="190" x2="120" y2="580" stroke="#0f172a" stroke-width="3"/>

  <text x="86" y="585" class="small">$0</text>
  <text x="70" y="482" class="small">$1.5</text>
  <text x="76" y="384" class="small">$3.0</text>
  <text x="76" y="286" class="small">$4.5</text>
  <text x="76" y="188" class="small">$6.0</text>

  <rect x="260" y="188" width="220" height="392" fill="#fecaca" stroke="#b91c1c" stroke-width="2" rx="20" ry="20"/>
  <text x="317" y="624" class="label">无缓存</text>
  <text x="326" y="164" class="value">$6.00</text>
  <text x="296" y="276" class="text">每轮都重跑</text>
  <text x="298" y="306" class="text">20K+ 静态前缀</text>
  <text x="306" y="336" class="text">重复 prefill</text>

  <rect x="720" y="505" width="220" height="75" fill="#86efac" stroke="#15803d" stroke-width="2" rx="20" ry="20"/>
  <text x="757" y="624" class="label">92% 命中</text>
  <text x="775" y="480" class="value">$1.15</text>
  <text x="754" y="530" class="text">大多数 token</text>
  <text x="762" y="560" class="text">转成 cache read</text>

  <rect x="550" y="215" width="500" height="180" fill="#fffdf8" stroke="#0f172a" stroke-width="2" rx="24" ry="24"/>
  <text x="585" y="258" class="label">为什么差距会被拉大</text>
  <text x="585" y="300" class="text">1. 第一轮仍然要写缓存，所以不会免费。</text>
  <text x="585" y="334" class="text">2. 后续轮次越多，cache read 占比越高。</text>
  <text x="585" y="368" class="text">3. 前缀越稳定，重复支付 full-price input 的部分越少。</text>

  <rect x="550" y="425" width="500" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="20" ry="20"/>
  <text x="585" y="465" class="small">文中判断的重点不在具体美元数，而在于：</text>
  <text x="585" y="496" class="small">长会话 agent 的账单结构，会被“前缀是否稳定”显著改变。</text>
</svg>
