<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prompt caching 中的静态前缀与动态后缀</title>
  <desc id="desc">展示 agent 请求如何拆成稳定的静态前缀和不断增长的动态后缀，以及哪些部分适合被缓存。</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ec; }
      .panel { fill: #fffdf8; stroke: #1e293b; stroke-width: 2; rx: 26; ry: 26; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .boxtext { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .pill { stroke: #0f172a; stroke-width: 1.5; rx: 18; ry: 18; }
      .callout { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7c2d12; }
      .line { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <text x="80" y="82" class="title">一个 agent 请求，真正稳定的只有前缀</text>
  <text x="80" y="116" class="subtitle">原创示意图：基于原文观点重绘，用来区分长期可复用上下文与每轮新增内容</text>

  <rect x="70" y="150" width="1060" height="500" class="panel"/>

  <text x="110" y="205" class="label">请求结构</text>

  <rect x="110" y="245" width="730" height="86" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="18" ry="18"/>
  <text x="140" y="298" class="boxtext">静态前缀：system instructions / tool definitions / project context / 行为规则</text>

  <rect x="110" y="357" width="730" height="86" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="18" ry="18"/>
  <text x="140" y="410" class="boxtext">动态后缀：用户消息 / assistant 回复 / 工具输出 / 终端观察</text>

  <rect x="110" y="469" width="730" height="86" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="18" ry="18"/>
  <text x="140" y="522" class="boxtext">后续轮次：继续在后缀尾部追加，而不是改写上面的静态前缀</text>

  <path class="line" d="M875 288 C930 288 940 288 990 288"/>
  <path class="line" d="M875 400 C930 400 940 400 990 400"/>

  <rect x="980" y="228" width="110" height="118" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="22" ry="22"/>
  <text x="1008" y="276" class="label" font-size="20">可缓存</text>
  <text x="1004" y="311" class="small">hash 稳定</text>

  <rect x="980" y="340" width="110" height="118" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="22" ry="22"/>
  <text x="1008" y="388" class="label" font-size="20">不缓存</text>
  <text x="994" y="423" class="small">持续增长</text>

  <rect x="130" y="585" width="320" height="38" fill="#fff7ed" class="pill"/>
  <text x="155" y="610" class="small">工程关键：把“稳定内容”放在最上面</text>

  <rect x="475" y="585" width="300" height="38" fill="#fff7ed" class="pill"/>
  <text x="501" y="610" class="small">状态更新写进后续消息，不改前缀</text>

  <rect x="800" y="585" width="280" height="38" fill="#fff7ed" class="pill"/>
  <text x="834" y="610" class="small">命中率高低取决于结构纪律</text>

  <text x="980" y="500" class="callout">只要前缀变了，整段缓存就失效</text>
</svg>
