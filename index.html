---
---
<!DOCTYPE html>
<html lang="zh-CN" data-section="home" data-intensity="medium">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiracleFarms — AI Infrastructure in public</title>
<meta name="description" content="MiracleFarms 是一个公开记录 AI Infrastructure 演进、实验与判断的研究写作站点。" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/notion.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="assets/shared.jsx"></script>
<script type="text/babel">
/* global React, ReactDOM, TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle,
          Icon, MFMark, HandleDots, Topbar, PageFooter, SECTIONS, NAV_ORDER,
          ALL_BRIEFS, ALL_READINGS, ALL_FIELDS, ALL_ESSAYS, ALL_FOUNDATIONS,
          useApplyTweaks, useSection */

/* ── Jekyll live data (overrides shared.jsx defaults) ── */
{% assign _briefs = site.posts | where: 'kind', 'brief' %}
window.ALL_BRIEFS = [
{% for post in _briefs %}
  {"date":"{{ post.date | date: '%Y.%m.%d' }}","title":{{ post.title | jsonify }},"excerpt":{{ post.intro | default: "" | truncate: 140 | jsonify }},"tags":{{ post.tags | jsonify }},"href":"{{ post.url | absolute_url }}","locked":{{ post.locked | default: false | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
{% assign _readings = site.posts | where: 'kind', 'reading' %}
window.ALL_READINGS = [
{% for post in _readings %}
  {"date":"{{ post.date | date: '%Y.%m.%d' }}","title":{{ post.title | jsonify }},"excerpt":{{ post.intro | default: "" | truncate: 140 | jsonify }},"tags":{{ post.tags | jsonify }},"href":"{{ post.url | absolute_url }}","locked":{{ post.locked | default: false | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
{% assign _fields = site.posts | where: 'kind', 'field-note' %}
window.ALL_FIELDS = [
{% for post in _fields %}
  {"date":"{{ post.date | date: '%Y.%m.%d' }}","title":{{ post.title | jsonify }},"excerpt":{{ post.intro | default: "" | truncate: 140 | jsonify }},"tags":{{ post.tags | jsonify }},"href":"{{ post.url | absolute_url }}","locked":{{ post.locked | default: false | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
{% assign _essays = site.posts | where: 'kind', 'essay' %}
window.ALL_ESSAYS = [
{% for post in _essays %}
  {"date":"{{ post.date | date: '%Y.%m.%d' }}","title":{{ post.title | jsonify }},"excerpt":{{ post.intro | default: "" | truncate: 140 | jsonify }},"tags":{{ post.tags | jsonify }},"href":"{{ post.url | absolute_url }}","locked":{{ post.locked | default: false | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
{% assign _found = site.posts | where: 'kind', 'founding-note' %}
window.ALL_FOUNDATIONS = [
{% for post in _found %}
  {"date":"{{ post.date | date: '%Y.%m.%d' }}","title":{{ post.title | jsonify }},"excerpt":{{ post.intro | default: "" | truncate: 140 | jsonify }},"tags":{{ post.tags | jsonify }},"href":"{{ post.url | absolute_url }}","locked":{{ post.locked | default: false | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
];
{% raw %}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontStyle": "serif",
  "smallText": false,
  "fullWidth": false,
  "intensity": "medium"
}/*EDITMODE-END*/;

const COUNTS = {
  briefs: ALL_BRIEFS, readings: ALL_READINGS, fields: ALL_FIELDS,
  essays: ALL_ESSAYS, foundations: ALL_FOUNDATIONS,
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  useSection("home");
  useApplyTweaks(t);

  const recent = ALL_BRIEFS.slice(0, 5);

  return (
    <>
      <Topbar active="home" />
      <main className="page">
        <div className="pg-meta">
          <span>AI Infra Research Journal</span>
          <span className="dot">·</span>
          <span>公开写作</span>
          <span className="dot">·</span>
          <span>持续维护</span>
        </div>

        <div className="pg-headband">
          <div className="pg-head">
            <span className="pg-stamp" aria-hidden="true"><MFMark size={28} /></span>
            <div className="pg-headtext">
              <span className="pg-kicker">AI INFRA · JOURNAL <span className="cjk">公开写作</span></span>
              <h1 className="pg-title">MiracleFarms</h1>
            </div>
          </div>
          <hr className="pg-rule" />
          <p className="pg-sub">公开记录 AI Infrastructure 的演进、实验与判断。</p>
          <p className="pg-sub-small">
            研究 inference systems、agent runtime、memory、evaluation 与可靠 AI engineering，像经营农场一样持续搭建、观察、迭代。
          </p>
        </div>

        <div className="pill-row">
          <a className="pill primary" href="#journal"><Icon name="spark" size={13} /> <span>阅读最新</span></a>
          <a className="pill" href="/briefs/"><span>Briefs</span></a>
          <a className="pill" href="/essays/"><span>Essays</span></a>
          <a className="pill" href="https://github.com/lycheenice" target="_blank" rel="noopener">
            <Icon name="github" size={13} /> <span>GitHub</span>
          </a>
        </div>

        <aside className="callout">
          <span className="ico" aria-hidden="true">🌱</span>
          <div>
            <p>
              <strong>Less hype, more systems.</strong>　每一篇都尽量回答一个值得继续追下去的问题——不追热点摘要，留下可验证、可落地、可复盘的工程判断。
            </p>
          </div>
        </aside>

        <h6 className="h2-sub">Sections</h6>
        <h2 className="h2">五个板块，五种记录</h2>
        <p className="muted" style={{ marginTop: 4, marginBottom: 14 }}>
          每个板块回答一个不同的问题，并对应一种颜色——与微信公众号推文的主题配色一致。
        </p>

        <div className="secnav">
          {NAV_ORDER.filter(k => k !== "home").map(key => {
            const s = SECTIONS[key];
            return (
              <a key={key} className="secnav-card" data-sec={key} href={"/" + key + "/"}>
                <span className="sc-stamp" aria-hidden="true"><MFMark size={22} /></span>
                <div>
                  <div className="sc-name">{s.name}</div>
                  <div className="sc-kicker">{s.label}</div>
                  <div className="sc-desc">{s.sub}</div>
                </div>
                <span className="sc-count">{COUNTS[key].length} 篇</span>
              </a>
            );
          })}
        </div>

        <h6 className="h2-sub">Recent Updates</h6>
        <h2 className="h2" id="journal">最近更新</h2>
        <p className="muted" style={{ marginTop: 4, marginBottom: 8 }}>
          按发布日期倒序。<a href="/briefs/" style={{ textDecoration: "underline", textDecorationColor: "var(--rule)", textUnderlineOffset: "3px" }}>查看全部 Briefs →</a>
        </p>

        <div className="pagelist" role="list">
          {recent.map((b, i) => (
            <a key={i} className="pagelink" href={b.href} role="listitem">
              <HandleDots />
              <span className="pl-ico" aria-hidden="true"><Icon name="doc" size={16} /></span>
              <div className="pl-body">
                <div className="pl-title">{b.title}{b.locked && <span className="pl-lock" aria-label="需要密码">🔒</span>}</div>
                <div className="pl-excerpt">{b.excerpt}</div>
                <div className="pl-meta">
                  {b.tags.map(tag => <span key={tag} className="tag">{tag}</span>)}
                </div>
              </div>
              <div className="pl-date">Brief · {b.date}</div>
            </a>
          ))}
        </div>

        <hr className="divider" />

        <h6 className="h2-sub">About</h6>
        <h2 className="h2">关于 MiracleFarms</h2>
        <p>
          MiracleFarms 是一个公开写作的 AI Infrastructure 研究站点。我们长期跟踪 inference systems、agent runtime、memory、evaluation 与 reliable AI engineering，记录系统如何从“能跑”走向“可用”。
        </p>
        <p className="muted">
          “Farms” 用复数，是因为这里关注的不是某一个单点成果，而是一组持续生长的系统、工具和主题。完整的缘起与方法，见 <a href="/foundations/" style={{ textDecoration: "underline", textDecorationColor: "var(--rule)", textUnderlineOffset: "3px" }}>Foundations →</a>
        </p>

        <dl className="props">
          <dt><Icon name="spark" size={13} /> 关注</dt>
          <dd>
            <span className="tag">Inference</span>
            <span className="tag">Agents</span>
            <span className="tag">Memory</span>
            <span className="tag">Reliability</span>
          </dd>
          <dt><Icon name="list" size={13} /> 形式</dt>
          <dd>
            <span className="tag">Briefs</span>
            <span className="tag">Readings</span>
            <span className="tag">Fields</span>
            <span className="tag">Essays</span>
          </dd>
          <dt><Icon name="feed" size={13} /> 风格</dt>
          <dd>Less hype, more systems.</dd>
          <dt><Icon name="wechat" size={13} /> 公众号</dt>
          <dd>
            <a href="https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=MzAxNzg4NDc4MQ==" target="_blank" rel="noopener" style={{ textDecoration: "underline", textDecorationColor: "var(--rule)", textUnderlineOffset: "3px" }}>
              MiracleFarms
            </a>
          </dd>
        </dl>

        <PageFooter />
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection label="板块色强度 Section colour">
          <TweakRadio
            value={t.intensity}
            onChange={(v) => setTweak("intensity", v)}
            options={[
              { value: "clean",      label: "克制" },
              { value: "medium",     label: "中度" },
              { value: "expressive", label: "明显" },
            ]}
          />
        </TweakSection>
        <TweakSection label="字体 Font style">
          <TweakRadio
            value={t.fontStyle}
            onChange={(v) => setTweak("fontStyle", v)}
            options={[
              { value: "default", label: "Default" },
              { value: "serif",   label: "Serif" },
              { value: "mono",    label: "Mono" },
            ]}
          />
        </TweakSection>
        <TweakSection label="排版 Layout">
          <TweakToggle label="Small text 小字号" value={t.smallText} onChange={(v) => setTweak("smallText", v)} />
          <TweakToggle label="Full width 全宽页面" value={t.fullWidth} onChange={(v) => setTweak("fullWidth", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
{% endraw %}
</script>

<style id="__om-edit-overrides"></style>
</body>
</html>
