<!DOCTYPE html>
<html lang="zh-CN" data-section="home" data-intensity="medium">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiracleFarms — AI Infrastructure in public</title>
<meta name="description" content="MiracleFarms 是一个公开记录 AI Infrastructure 演进、实验与判断的研究写作站点。" />

<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/notion.css" />

<script src="/assets/js/react.production.min.js"></script>
<script src="/assets/js/react-dom.production.min.js"></script>
<script src="/assets/js/tweaks-panel.js"></script>
<script src="/assets/js/shared.js"></script>
</head>
<body>
<div id="root"></div>

<noscript>
  <main class="page">
    <h1>MiracleFarms</h1>
    <p>公开记录 AI Infrastructure 的演进、实验与判断。</p>
    <p>板块：<a href="/briefs/">Briefs</a> · <a href="/readings/">Readings</a> · <a href="/fields/">Fields</a> · <a href="/essays/">Essays</a> · <a href="/foundations/">Foundations</a></p>
    <h2 class="h2">最近更新</h2>
    <ul class="pagelist-fallback">
    {% assign _recent = site.posts | sort: 'date' | reverse %}
    {% assign _n = 0 %}
    {% for post in _recent %}{% unless post.path contains '.en.md' %}{% if _n < 8 %}
      <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span>{{ post.date | date: '%Y-%m-%d' }}</span></li>
      {% assign _n = _n | plus: 1 %}
    {% endif %}{% endunless %}{% endfor %}
    </ul>
    <p class="muted">本页通常由 JavaScript 渲染；当前为无脚本回退视图。</p>
  </main>
</noscript>

<script>
/* ── Jekyll live data (overrides shared.jsx defaults) ── */
window.MF_INVESTMENT_URL = {{ site.investment_url | default: '' | jsonify }};
{% assign en_paths = '' %}{% for p in site.posts %}{% if p.path contains '.en.md' %}{% assign en_paths = en_paths | append: '||' | append: p.path %}{% endif %}{% endfor %}
{% assign _briefs = site.posts | where: 'kind', 'brief' %}
window.ALL_BRIEFS = [
{% for post in _briefs %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
{% assign _readings = site.posts | where: 'kind', 'reading' %}
window.ALL_READINGS = [
{% for post in _readings %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
{% assign _fields = site.posts | where: 'kind', 'field-note' %}
window.ALL_FIELDS = [
{% for post in _fields %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
{% assign _essays = site.posts | where: 'kind', 'essay' %}
window.ALL_ESSAYS = [
{% for post in _essays %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
{% assign _found = site.posts | where: 'kind', 'founding-note' %}
window.ALL_FOUNDATIONS = [
{% for post in _found %}
  {% unless post.path contains '.en.md' %}{% include post-card-json.html post=post en_paths=en_paths %}{% unless forloop.last %},{% endunless %}{% endunless %}
{% endfor %}
];
</script>
<script src="/assets/js/pages/home.js"></script>

<style id="__om-edit-overrides"></style>
</body>
</html>
