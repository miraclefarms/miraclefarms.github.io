<!-- MiracleFarms · Distribution constellation (hero level) -->
<!-- Toggle a channel's state by changing data-status: "main" | "live" | "pending" | "archive" -->
<section class="mf-const" aria-label="Distribution channels">
  <div class="mf-const-head">
    <span>分发矩阵 · DISTRIBUTION</span>
    <span class="mf-const-r">主站为中心 · 卫星为渠道</span>
  </div>

  <div class="mf-const-grid">
    <a class="mf-ch-node" data-status="main" href="{{ '/' | relative_url }}">
      <div class="mf-ch-top">
        <span class="mf-ch-ico"><svg  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="1.6" fill="currentColor"/><path d="M4 14h16M5 18h14M7 22h10"/></svg></span>
        <span class="mf-ch-status">MAIN</span>
      </div>
      <span class="mf-ch-name">主站</span>
      <span class="mf-ch-role">沉浸阅读 / 长期归档 / 全文索引</span>
    </a>

    <button class="mf-ch-node" data-status="live" type="button" data-wechat-open aria-haspopup="dialog" aria-controls="mf-wechat-dialog">
      <div class="mf-ch-top">
        <span class="mf-ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4C5.1 4 2 6.7 2 10c0 1.7.8 3.2 2.2 4.3L3.5 17l3-1.6c.7.2 1.5.3 2.3.3"/><path d="M22 14.5c0-2.7-2.6-4.9-5.8-4.9S10.4 11.8 10.4 14.5s2.6 4.9 5.8 4.9c.7 0 1.3-.1 1.9-.3l2.4 1.3-.6-2.1c1.2-.9 2.1-2.2 2.1-3.8z"/></svg></span>
        <span class="mf-ch-status">LIVE</span>
      </div>
      <span class="mf-ch-name">微信公众号</span>
      <span class="mf-ch-role">每日早报推送 / 主页订阅入口</span>
    </button>

    <span class="mf-ch-node" data-status="pending" aria-disabled="true">
      <div class="mf-ch-top">
        <span class="mf-ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M8 6v14M4 20l4-4M14 9h6M14 9v10l3-3 3 3V9"/></svg></span>
        <span class="mf-ch-status">敬请期待</span>
      </div>
      <span class="mf-ch-name">知乎</span>
      <span class="mf-ch-role">长文讨论与回答</span>
    </span>

    <span class="mf-ch-node" data-status="pending" aria-disabled="true">
      <div class="mf-ch-top">
        <span class="mf-ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9v6M8 9l4 3-4 3M16 9v6M13 12h6"/></svg></span>
        <span class="mf-ch-status">敬请期待</span>
      </div>
      <span class="mf-ch-name">小红书</span>
      <span class="mf-ch-role">图卡精选 / 视觉摘要</span>
    </span>

    <span class="mf-ch-node" data-status="pending" aria-disabled="true">
      <div class="mf-ch-top">
        <span class="mf-ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg></span>
        <span class="mf-ch-status">敬请期待</span>
      </div>
      <span class="mf-ch-name">X · Twitter</span>
      <span class="mf-ch-role">英文摘要 / 国际信号</span>
    </span>
  </div>

  <div class="mf-const-foot">
    <span>实线 = 已接入</span>
    <span>·</span>
    <span>虚线 = 占位 (soon)</span>
  </div>
</section>
