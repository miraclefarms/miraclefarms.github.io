name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    # Triggered by miraclefarms-content when new content is published
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rendering layer
        uses: actions/checkout@v4

      - name: Checkout private content repo
        uses: actions/checkout@v4
        with:
          repository: miraclefarms/miraclefarms-content
          token: ${{ secrets.CONTENT_REPO_PAT }}
          path: _private

      - name: Inject posts and assets
        run: |
          cp -r _private/_posts/. _posts/
          rsync -a --exclude='css' --exclude='icons' _private/assets/ assets/

      - name: Setup Python for wiki build
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wiki
        run: |
          pip install mkdocs-material --quiet
          cd _private/wiki-src && mkdocs build --clean --site-dir ../../wiki

      - name: Cleanup private checkout
        run: rm -rf _private

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --future
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
