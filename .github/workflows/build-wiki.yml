name: Build Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki-src/**"
      - ".github/workflows/build-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install -r wiki-src/requirements.txt

      - name: Build wiki into /wiki
        run: |
          cd wiki-src
          mkdocs build --clean --site-dir ../wiki

      - name: Commit built wiki
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add wiki
          git diff --cached --quiet || git commit -m "chore: build wiki [skip ci]"
          git push
